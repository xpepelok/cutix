[workspace]
resolver = "2"
members = [
    "apps/native",
    "crates/audio",
    "crates/bridge",
    "crates/capcut",
    "crates/compositor",
    "crates/dsp",
    "crates/effects",
    "crates/export",
    "crates/fixtures",
    "crates/gpu",
    "crates/i18n",
    "crates/masks",
    "crates/ml",
    "crates/playback",
    "crates/project",
    "crates/scalebench",
    "crates/sounds",
    "crates/speech",
    "crates/stickers",
    "crates/template",
    "crates/time",
    "crates/video",
    "crates/watermark",
    "crates/youtube",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/xpepelok/cutix"

[workspace.dependencies]
bytes = "1"
image = { version = "0.25", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"
thiserror = "2.0"
uuid = { version = "1", features = ["v4"] }

[workspace.lints.rust]
unused = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
too_many_arguments = "warn"
type_complexity = "warn"
