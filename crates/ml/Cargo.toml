[package]
name = "ml"
version.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true

[lib]
path = "src/lib.rs"
crate-type = ["rlib"]

[dependencies]
thiserror = { workspace = true }
ureq = "2.10"
serde = { workspace = true }
serde_json = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
fixtures = { version = "0.1.0", path = "../fixtures" }
cutix-project = { version = "0.1.0", path = "../project" }
video = { version = "0.1.0", path = "../video" }
puremp3 = "0.1"
speech = { version = "0.1.0", path = "../speech" }

[target.'cfg(all(windows, target_arch = "x86_64"))'.dependencies]
ort = { version = "2.0.0-rc.10", features = ["download-binaries"] }

[target.'cfg(not(all(windows, target_arch = "x86_64")))'.dependencies]
ort = { version = "2.0.0-rc.10", default-features = false, features = ["load-dynamic", "ndarray"] }

[lints]
workspace = true
