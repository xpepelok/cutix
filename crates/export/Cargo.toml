[package]
name = "cutix-export"
version.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true

[lib]
path = "src/lib.rs"
crate-type = ["rlib"]

[dependencies]
cutix-playback = { version = "0.1.0", path = "../playback" }
cutix-project = { version = "0.1.0", path = "../project" }
time = { version = "0.1.0", path = "../time" }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { version = "1.0", features = ["preserve_order"] }
uuid = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bytes = { workspace = true }
mp4 = "0.14"
openh264 = "0.8"
video = { version = "0.1.0", path = "../video" }
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }
fixtures = { version = "0.1.0", path = "../fixtures" }
tempfile = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png"] }
serde_json = { workspace = true }
symphonia = { version = "0.5", default-features = false, features = ["isomp4", "aac"] }

[lints]
workspace = true
