[package]
name = "youtube"
version.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true

[lib]
path = "src/lib.rs"
crate-type = ["rlib"]

[dependencies]
dirs = "5.0"
serde = { workspace = true }
serde_json = { workspace = true }
# DevTools is a websocket on loopback, so the handshake is all that is needed — no TLS stack.
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }

# The job object that takes every browser we start down with the app, and the time-zone
# rules that turn a UTC schedule into the wall-clock time Studio's picker expects.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_Time",
] }

# `localtime_r` for the same wall-clock conversion off Windows.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lints]
workspace = true
