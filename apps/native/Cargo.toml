[package]
name = "cutix"
version = "0.0.1"
edition = "2021"

[[bin]]
name = "cutix"
path = "src/main.rs"

[dependencies]
audio = { version = "0.1.0", path = "../../rust/crates/audio" }
capcut = { version = "0.1.0", path = "../../rust/crates/capcut" }
dsp = { version = "0.1.0", path = "../../rust/crates/dsp" }
gpui = "0.2.2"
ureq = "2.10"
cutix-i18n = { version = "0.1.0", path = "../../rust/crates/i18n" }
cutix-export = { version = "0.1.0", path = "../../rust/crates/export" }
cutix-playback = { version = "0.1.0", path = "../../rust/crates/playback" }
cutix-project = { version = "0.1.0", path = "../../rust/crates/project" }
time = { version = "0.1.0", path = "../../rust/crates/time" }
masks = { version = "0.1.0", path = "../../rust/crates/masks" }
ml = { version = "0.1.0", path = "../../rust/crates/ml" }
video = { version = "0.1.0", path = "../../rust/crates/video" }
speech = { version = "0.1.0", path = "../../rust/crates/speech" }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
smallvec = "1"
sounds = { version = "0.1.0", path = "../../rust/crates/sounds" }
watermark = { version = "0.1.0", path = "../../rust/crates/watermark" }
stickers = { version = "0.1.0", path = "../../rust/crates/stickers" }
template = { version = "0.1.0", path = "../../rust/crates/template" }
uuid = { version = "1", features = ["v4"] }
youtube = { version = "0.1.0", path = "../../rust/crates/youtube" }
dirs = "6.0"
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }

[dev-dependencies]
gpui = { version = "0.2.2", features = ["test-support"] }
tempfile = "3"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Data_Xml_Dom",
    "UI_Notifications",
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Com_StructuredStorage",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Globalization",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]  }
