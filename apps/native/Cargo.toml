[package]
name = "cutix"
version = "0.0.2"
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# The GPUI views have not been moved to edition 2024 yet: its closure-capture and
# temporary-lifetime rules reject a large amount of the view code, and rewriting that
# belongs in its own change rather than riding along with a manifest cleanup.
edition = "2021"

[[bin]]
name = "cutix"
path = "src/main.rs"

[dependencies]
audio = { version = "0.1.0", path = "../../crates/audio" }
capcut = { version = "0.1.0", path = "../../crates/capcut" }
dsp = { version = "0.1.0", path = "../../crates/dsp" }
gpui = "0.2.2"
ureq = "2.10"
cutix-i18n = { version = "0.1.0", path = "../../crates/i18n" }
cutix-export = { version = "0.1.0", path = "../../crates/export" }
cutix-playback = { version = "0.1.0", path = "../../crates/playback" }
cutix-project = { version = "0.1.0", path = "../../crates/project" }
time = { version = "0.1.0", path = "../../crates/time" }
masks = { version = "0.1.0", path = "../../crates/masks" }
ml = { version = "0.1.0", path = "../../crates/ml" }
video = { version = "0.1.0", path = "../../crates/video" }
speech = { version = "0.1.0", path = "../../crates/speech" }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
serde = { workspace = true }
serde_json = { workspace = true }
smallvec = "1"
sounds = { version = "0.1.0", path = "../../crates/sounds" }
watermark = { version = "0.1.0", path = "../../crates/watermark" }
stickers = { version = "0.1.0", path = "../../crates/stickers" }
template = { version = "0.1.0", path = "../../crates/template" }
uuid = { workspace = true }
youtube = { version = "0.1.0", path = "../../crates/youtube" }
dirs = "6.0"
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }

[dev-dependencies]
gpui = { version = "0.2.2", features = ["test-support"] }
tempfile = { workspace = true }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Data_Xml_Dom",
    "UI_Notifications",
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Com_StructuredStorage",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Globalization",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]  }

[lints]
workspace = true
