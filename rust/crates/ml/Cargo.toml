[package]
name = "ml"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"
crate-type = ["rlib"]

[dependencies]
thiserror = "2.0"
ureq = "2.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
fixtures = { version = "0.1.0", path = "../fixtures" }
cutix-project = { version = "0.1.0", path = "../project" }
video = { version = "0.1.0", path = "../video" }
puremp3 = "0.1"
speech = { version = "0.1.0", path = "../speech" }

[target.'cfg(windows)'.dependencies]
ort = { version = "2.0.0-rc.10", features = ["download-binaries"] }

[target.'cfg(not(windows))'.dependencies]
ort = { version = "2.0.0-rc.10", default-features = false, features = ["load-dynamic", "ndarray"] }
