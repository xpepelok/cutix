[package]
name = "cutix-playback"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"
crate-type = ["rlib"]

[dependencies]
compositor = { version = "0.1.0", path = "../compositor" }
cosmic-text = "0.14"
effects = { version = "0.1.0", path = "../effects" }
gpu = { version = "0.1.0", path = "../gpu" }
masks = { version = "0.1.0", path = "../masks" }
ml = { version = "0.1.0", path = "../ml" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
cutix-project = { version = "0.1.0", path = "../project" }
serde_json = "1.0"
stickers = { version = "0.1.0", path = "../stickers" }
thiserror = "2.0"
time = { version = "0.1.0", path = "../time" }
watermark = { version = "0.1.0", path = "../watermark" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cpal = "0.15"
pollster = "0.4"
puremp3 = "0.1"
video = { version = "0.1.0", path = "../video" }

symphonia = { version = "0.5", default-features = false, features = ["isomp4", "aac"] }

[dev-dependencies]
fixtures = { version = "0.1.0", path = "../fixtures" }
tempfile = "3"
masks = { version = "0.1.0", path = "../masks" }
image = { version = "0.25", default-features = false, features = ["png"] }
serde_json = "1.0"
