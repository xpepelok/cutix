[package]
name = "cutix-export"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"
crate-type = ["rlib"]

[dependencies]
cutix-playback = { version = "0.1.0", path = "../playback" }
cutix-project = { version = "0.1.0", path = "../project" }
time = { version = "0.1.0", path = "../time" }
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bytes = "1"
mp4 = "0.14"
openh264 = "0.8"
video = { version = "0.1.0", path = "../video" }
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
fixtures = { version = "0.1.0", path = "../fixtures" }
tempfile = "3"
image = { version = "0.25", default-features = false, features = ["png"] }
serde_json = "1.0"
symphonia = { version = "0.5", default-features = false, features = ["isomp4", "aac"] }
