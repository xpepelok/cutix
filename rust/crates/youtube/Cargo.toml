[package]
name = "youtube"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"
crate-type = ["rlib"]

[dependencies]
dirs = "5.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# DevTools is a websocket on loopback, so the handshake is all that is needed — no TLS stack.
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
